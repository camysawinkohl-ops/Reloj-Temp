<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Reloj + Temperatura</title>

  <style>
    html, body { height: 100%; margin: 0; }
    body{
      font-family: -apple-system, Helvetica, Arial, sans-serif;
      background: #0b1220;
      color: #e7eefc;
      display:flex;
      align-items:center;
      justify-content:center;
      padding: 14px;
      box-sizing: border-box;
    }

    /* Tarjeta */
    .card{
      width: 96vw;
      max-width: 1000px;
      border-radius: 26px;
      background: rgba(255,255,255,0.06);
      box-shadow: 0 12px 40px rgba(0,0,0,0.35);
      border: 1px solid rgba(255,255,255,0.10);
      padding: 14px;
      box-sizing: border-box;
    }

    /* Layout 2 columnas (iPad friendly) */
    .layout{
      display: -webkit-box;
      display: -ms-flexbox;
      display: flex;
      gap: 14px;
      -webkit-box-align: stretch;
      -ms-flex-align: stretch;
      align-items: stretch;
    }

    /* IZQUIERDA: foto */
    .left{
      -webkit-box-flex: 1;
      -ms-flex: 1 1 48%;
      flex: 1 1 48%;
      min-width: 280px;
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.10);
      background: rgba(255,255,255,0.05);
      height: 420px; /* Alto para que se vea “completa” en horizontal */
    }

    /* Foto completa (sin recorte) */
    .photo{
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;          /* ✅ muestra toda la foto */
      background: rgba(0,0,0,0.18); /* bandas prolijas si la foto es vertical */
    }

    /* DERECHA: datos */
    .right{
      -webkit-box-flex: 1;
      -ms-flex: 1 1 52%;
      flex: 1 1 52%;
      min-width: 300px;
      text-align: center;
      padding: 6px 6px 2px 6px;
      box-sizing: border-box;
    }

    .time{
      font-size: 64px;
      line-height: 1.05;
      letter-spacing: 1px;
      font-weight: 800;
      margin: 6px 0 6px;
    }

    .date{
      font-size: 18px;
      opacity: .9;
      margin: 0 0 10px;
    }

    .row{
      display:flex;
      gap: 12px;
      justify-content:center;
      flex-wrap:wrap;
      margin-top: 10px;
    }

    .pill{
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 999px;
      padding: 10px 12px;
      min-width: 200px;
      box-sizing: border-box;
    }

    .label{
      opacity:.75;
      font-size: 13px;
      display:block;
      margin-bottom: 5px;
      letter-spacing: .3px;
    }

    .value{
      font-size: 24px;
      font-weight: 750;
    }

    .btnbar{ margin-top: 12px; }

    button{
      border:0;
      border-radius: 999px;
      padding: 9px 13px;
      font-size: 14px;
      background: rgba(231,238,252,0.14);
      color: #e7eefc;
      cursor:pointer;
      margin: 4px 6px;
    }
    button:active{ transform: scale(0.98); }

    .footer{
      margin-top: 16px;
      padding-top: 12px;
      border-top: 1px solid rgba(255,255,255,0.10);
    }

    .family{
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 0.4px;
      margin-bottom: 4px;
    }

    .quote{
      font-size: 16px;
      opacity: 0.92;
      font-style: italic;
      padding: 0 8px;
    }

    .small{
      font-size: 12px;
      opacity: .7;
      margin-top: 8px;
    }

    /* En vertical (pantallas angostas) apila */
    @media (max-width: 820px){
      .layout{
        -webkit-box-orient: vertical;
        -webkit-box-direction: normal;
        -ms-flex-direction: column;
        flex-direction: column;
      }
      .left{
        height: 280px; /* foto grande en vertical */
        min-width: 0;
      }
      .time{ font-size: 60px; }
    }
  </style>
</head>

<body>
  <div class="card">
    <div class="layout">

      <!-- IZQUIERDA: FOTO COMPLETA -->
      <div class="left">
        <!-- Usamos URL ABSOLUTA + ?v=1 para evitar caché -->
        <img
          src="https://camysawinkohl-ops.github.io/Reloj-Temp/IMG_20221216_200058341_Original.jpeg?v=1"
          class="photo"
          alt="Foto"
        >
      </div>

      <!-- DERECHA: DATOS -->
      <div class="right">
        <div id="time" class="time">--:--:--</div>
        <div id="date" class="date">Cargando fecha…</div>

        <div class="row">
          <div class="pill">
            <span class="label">Temperatura</span>
            <span id="temp" class="value">-- °C</span>
          </div>
          <div class="pill">
            <span class="label">Ubicación</span>
            <span id="loc" class="value" style="font-size:16px;font-weight:650;">Buenos Aires (fijo)</span>
          </div>
        </div>

        <div class="btnbar">
          <button onclick="useGeolocation()">Usar mi ubicación</button>
          <button onclick="refreshWeather()">Actualizar temp</button>
        </div>

        <div class="footer">
          <div class="family">Daiu y Junior</div>
          <div class="quote" id="quote">"Lo mejor está por venir."</div>
          <div id="status" class="small"></div>
        </div>
      </div>

    </div>
  </div>

<script>
(function(){
  // Config por defecto: Buenos Aires (Obelisco aprox.)
  var state = {
    lat: -34.6037,
    lon: -58.3816,
    tz: "America/Argentina/Buenos_Aires",
    label: "Buenos Aires (fijo)"
  };

  var timeEl = document.getElementById("time");
  var dateEl = document.getElementById("date");
  var tempEl = document.getElementById("temp");
  var locEl  = document.getElementById("loc");
  var statusEl = document.getElementById("status");

  function pad(n){ return (n < 10 ? "0" : "") + n; }

  function tickClock(){
    var now = new Date();
    var hh = pad(now.getHours());
    var mm = pad(now.getMinutes());
    var ss = pad(now.getSeconds());
    timeEl.innerHTML = hh + ":" + mm + ":" + ss;

    // Fecha simple (sin Intl por compatibilidad)
    var days = ["Domingo","Lunes","Martes","Miércoles","Jueves","Viernes","Sábado"];
    var months = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
    dateEl.innerHTML = days[now.getDay()] + " " + now.getDate() + " " + months[now.getMonth()] + " " + now.getFullYear();
  }

  function setStatus(msg){
    statusEl.innerHTML = msg || "";
  }

  // XHR (evita fetch para Safari viejo)
  function xhrGet(url, onOk, onErr){
    try{
      var x = new XMLHttpRequest();
      x.open("GET", url, true);
      x.onreadystatechange = function(){
        if (x.readyState === 4){
          if (x.status >= 200 && x.status < 300){
            onOk(x.responseText);
          } else {
            onErr("HTTP " + x.status);
          }
        }
      };
      x.send(null);
    } catch(e){
      onErr(e && e.message ? e.message : "Error XHR");
    }
  }

  function buildWeatherUrl(){
    return "https://api.open-meteo.com/v1/forecast"
      + "?latitude=" + encodeURIComponent(state.lat)
      + "&longitude=" + encodeURIComponent(state.lon)
      + "&current=temperature_2m"
      + "&timezone=" + encodeURIComponent(state.tz);
  }

  window.refreshWeather = function(){
    locEl.innerHTML = state.label;
    setStatus("Actualizando temperatura…");

    var url = buildWeatherUrl();
    xhrGet(url, function(txt){
      try{
        var data = JSON.parse(txt);
        var t = data && data.current && data.current.temperature_2m;
        if (typeof t === "number" || typeof t === "string"){
          tempEl.innerHTML = t + " °C";
          setStatus("OK • Última actualización: " + new Date().toLocaleTimeString());
        } else {
          setStatus("No pude leer la temperatura (respuesta inesperada).");
        }
      }catch(e){
        setStatus("Error parseando respuesta.");
      }
    }, function(err){
      setStatus("No pude traer clima (" + err + ").");
    });
  };

  window.useGeolocation = function(){
    if (!navigator.geolocation){
      setStatus("Este navegador no soporta geolocalización.");
      return;
    }
    setStatus("Pidiendo ubicación… (aceptá el permiso)");
    navigator.geolocation.getCurrentPosition(function(pos){
      state.lat = pos.coords.latitude;
      state.lon = pos.coords.longitude;
      state.label = "Mi ubicación";
      refreshWeather();
    }, function(){
      setStatus("No se pudo obtener ubicación (permiso/señal).");
    }, { enableHighAccuracy: false, timeout: 10000, maximumAge: 600000 });
  };

  // Frases (rotan)
  var quotes = [
    "Lo mejor está por venir.",
    "Paso a paso, se llega lejos.",
    "Hoy es un buen día para empezar.",
    "La constancia le gana al talento.",
    "Hacelo simple, hacelo posible."
  ];

  function setRandomQuote(){
    var q = quotes[Math.floor(Math.random() * quotes.length)];
    var el = document.getElementById("quote");
    if(el){ el.innerHTML = '"' + q + '"'; }
  }

  // Init
  tickClock();
  setInterval(tickClock, 1000);

  setRandomQuote();
  setInterval(setRandomQuote, 60 * 60 * 1000); // 1 hora

  refreshWeather();
  setInterval(refreshWeather, 10 * 60 * 1000); // 10 min
})();
</script>

</body>
</html>
